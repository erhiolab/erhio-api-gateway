# 网关配置
gateway:
    # 监听端口
    port: 8080
    # 每秒最大请求数
    qps-limit: 3
    # 每分钟最大请求数
    qpm-limit: 100

# 日志配置
logger:
    # 日志输出方式
    output: "stdout"
    # 系统日志文件路径
    log-path: "logs/api-gateway.log"
    # 请求日志文件路径
    request-log-path: "logs/request.log"
    # 日志文件最大大小(MB)
    max-size: 100
    # 日志文件最大备份数量
    max-backups: 10
    # 日志文件最大年龄(天)
    max-age: 30
    # 是否压缩日志文件
    compress: true


health:
    # Redis健康检查间隔(秒)
    redis-health-check-interval: 20
    # Redis健康检查失败阈值
    redis-health-check-fail-threshold: 3
    # Redis健康检查成功阈值
    redis-health-check-ok-threshold: 1

# Redis配置
redis:
    # 主机地址
    host: "localhost"
    # 端口
    port: 6379
    # 密码
    password: ""
    # 库索引
    db: 0
    # 项目前缀
    project-prefix: "elake-api"
    # 连接池大小
    pool-size: 100
    # 最小空闲连接数
    min-idle-connections: 10
    # 连接最大空闲时间(分钟)
    connection-max-idle-time: 15
    # 连接超时时间(秒)
    dial-timeout: 5
    # 读取超时时间(秒)
    read-timeout: 5
    # 写入超时时间(秒)
    write-timeout: 5

# 路由配置
routes:
    # -   path: "/api/test" 路径
    #     method: "GET" 请求方法
    #     service: "test-service" 服务名称
    #     require-auth: false 是否需要认证
    #     require-limit: false 是否需要限流
    -   path: "/"
        method: "GET"
        service: "test-service"
        require-auth: false
        require-limit: true

# 服务配置
services:
    # -   name: "test-service" 服务名称
    #     nodes: 服务节点列表
    #         - "http://localhost:3000" 服务节点
    -   name: "test-service"
        nodes:
            - "http://localhost:3000"
